version: 0.2
phases:
  install:
    commands:
       - echo "Installing dependencies"
       - npm i -f
  build:
    commands:
      - echo "Building the application"
      - npm run build
  post_build:
    commands:
      - echo "Uploading files to S3"
      # - aws s3 cp ./build s3://ui-artifacts-poc-zero-downtime/ --recursive
      - aws s3 cp ./build s3://$UIARTIFACTBUCKETNAME/ --recursive